name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # the same Ubuntu release (and so the same Yaru) the icons are developed against
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and the Yaru icon themes
        run: |
          # the Ubuntu archive is sometimes unreachable from the runners: retry instead of failing
          ok=0
          for attempt in 1 2 3 4; do
            if apt-get update -o Acquire::Retries=5 &&
               apt-get install -y -o Acquire::Retries=5 ca-certificates git yaru-theme-icon python3-pil python3-numpy  python3-scipy python3-pytest librsvg2-bin; then ok=1; break; fi
            echo "apt failed (attempt $attempt), retrying in 30 s"; sleep 30
          done
          [ "$ok" = 1 ]

      - name: Unit and integration tests
        run: python3 -m pytest -v

      - name: Generate a sample set (four variants)
        run: |
          python3 yaru-folder-icon.py batch --out dist --themes Yaru,Yaru-dark,Yaru-purple-dark,Yaru-sage --sizes 256 \
            --only '^(a|c|d|e|network-w|share|view-)' --jobs 4 | tail -3
          ls dist

      - name: Generate SVG sample set and check it renders
        run: |
          python3 yaru-folder-icon.py batch --out dist-svg --themes all --sizes svg \
            --only '^(a|c|d|e|network-w|share|view-)' --jobs 4 | tail -3
          test "$(find dist-svg -name '*.svg' | wc -l)" -gt 100
          for f in $(find dist-svg -name 'share.svg'); do rsvg-convert -w 128 "$f" > /dev/null; done

      - name: Help is printed without arguments
        run: python3 yaru-folder-icon.py | grep -q -- --skip-existing

      - name: Check generated icons are centred
        run: |
          # one run per theme (pytest already checks every variant on a sample); a few themes are enough here
          for t in Yaru Yaru-dark Yaru-purple-dark Yaru-sage; do
            d=dist/$t/256
            [ -d "$d" ] || continue
            echo "== $d"
            status=0
            python3 tools/check_centering.py "$d" --max-offset 1.0 > /tmp/centering.txt || status=$?
            head -3 /tmp/centering.txt
            test "$status" -eq 0
          done

      - name: Contact sheets for eyeballing
        if: always()
        run: |
          mkdir -p sheets
          for t in Yaru Yaru-dark Yaru-purple-dark; do
            [ -d dist/$t/256 ] && python3 tools/contact_sheet.py dist/$t/256 sheets/$t.png --every 4 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheets
          path: sheets/
